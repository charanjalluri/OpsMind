name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Import Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Byte-compile Python code
        run: python -m compileall backend

      - name: Verify FastAPI application import
        env:
          PYTHONPATH: .
          HINDSIGHT_API_KEY: dummy_ci_key
          HINDSIGHT_API_URL: https://api.hindsight.example.com
          HINDSIGHT_BANK_ID: opsmind-engineering
          META_MODEL_API_KEY: dummy_ci_key
        run: |
          python -c "from backend.app.main import app; print('Backend import successful:', app.title)"

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc -b

      - name: Build production bundle (vite)
        run: npm run build
